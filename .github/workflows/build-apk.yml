
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            11

      - name: Configure Java toolchains
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_11_X64" >> "$HOME/.gradle/gradle.properties"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Show available Android SDK packages
        run: |
          sdkmanager --list | grep -E "platforms;android-|build-tools;" | tail -40

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltWidget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
